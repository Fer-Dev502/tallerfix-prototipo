<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>TallerFix Prototipo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --primario:#1F4E79; --primario-osc:#163A5A; --acento:#F28C28; --fondo:#F4F6F8; --sup:#FFFFFF; --texto:#1B1F24; --suave:#5F6B76; --borde:#D5DBE1;
  --ok:#2E7D32; --alerta:#F9A825; --error:#C62828;
  --e-recibido:#607D8B; --e-diag:#5C6BC0; --e-esp:#E09F00; --e-rep:#1E88E5; --e-listo:#2E7D32; --e-ent:#455A64; --e-can:#C62828;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --fondo:#F4F6F8; } }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#E3E8ED;color:var(--texto);font-family:Roboto,"Segoe UI",Arial,sans-serif}
#app{max-width:420px;margin:0 auto;min-height:100vh;background:var(--fondo);display:flex;flex-direction:column;position:relative}
header{background:var(--primario);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;flex:1;font-weight:600}
.hb{background:none;border:0;color:#fff;font-size:22px;width:44px;height:44px;border-radius:50%;cursor:pointer}
main{flex:1;padding:14px 16px 120px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--sup);border:1px solid var(--borde);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.card.tap{cursor:pointer}
.card.tap:active{transform:scale(.99)}
.placa{font-weight:700;font-size:17px;letter-spacing:.5px}
.muted{color:var(--suave);font-size:14px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1}
.chip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;color:#fff;white-space:nowrap}
.filtros{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.filtros button{border:1px solid var(--borde);background:var(--sup);border-radius:20px;padding:8px 14px;font-size:14px;white-space:nowrap;min-height:40px;cursor:pointer}
.filtros button.on{background:var(--primario);color:#fff;border-color:var(--primario)}
input,textarea,select{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid var(--borde);border-radius:10px;background:#fff;color:var(--texto)}
label{font-size:13px;font-weight:600;color:var(--suave)}
.btn{min-height:52px;border-radius:12px;border:0;font-size:16px;font-weight:700;cursor:pointer;padding:0 16px;width:100%}
.btn.pri{background:var(--primario);color:#fff}
.btn.sec{background:#fff;color:var(--primario);border:2px solid var(--primario)}
.btn.ok{background:var(--ok);color:#fff}
.btn.mal{background:#fff;color:var(--error);border:2px solid var(--error)}
.btn:disabled{opacity:.5}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;width:calc(min(420px,100vw) - 32px);min-height:64px;border-radius:32px;border:0;background:var(--acento);color:#1B1F24;font-size:18px;font-weight:800;box-shadow:0 6px 16px rgba(0,0,0,.25);cursor:pointer;z-index:6}
.banner{border-radius:10px;padding:10px 12px;font-size:14px;display:flex;gap:8px;align-items:center}
.banner.off{background:#FFF4D6;color:#6B4E00;border:1px solid #F2D27A}
.banner.on{background:#E6F4EA;color:#1E5E24;border:1px solid #A9D5B0}
.banner.info{background:#E8F0F8;color:var(--primario-osc);border:1px solid #BFD3E6}
.tl{display:flex;flex-direction:column;gap:0}
.tl .p{display:flex;gap:12px;align-items:flex-start;position:relative;padding-bottom:16px}
.tl .p:not(:last-child)::after{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--borde)}
.tl .p.hecho:not(:last-child)::after{background:var(--ok)}
.dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--borde);background:#fff;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
.hecho .dot{background:var(--ok);border-color:var(--ok)}
.actual .dot{background:var(--e-esp);border-color:var(--e-esp)}
.actual b{color:var(--texto)}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:8px 4px;border-bottom:1px solid var(--borde);text-align:left}
td:last-child,th:last-child{text-align:right;white-space:nowrap}
.total td{font-weight:800;font-size:17px;border-bottom:0}
.foto{height:90px;border-radius:10px;background:linear-gradient(135deg,#cfd8dc,#eceff1);display:flex;align-items:center;justify-content:center;color:var(--suave);font-size:13px;flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#1B1F24;color:#fff;padding:12px 16px;border-radius:10px;font-size:14px;z-index:9;max-width:90%;text-align:center}
.switch{display:flex;align-items:center;gap:8px;font-size:13px;color:#fff;cursor:pointer;background:rgba(255,255,255,.15);padding:6px 10px;border-radius:20px;border:0}
.rol{min-height:96px;font-size:18px;text-align:left;display:flex;align-items:center;gap:14px;padding:16px}
.rol span{font-size:34px}
.cnt{display:flex;align-items:center;gap:10px}
.cnt button{width:52px;height:52px;border-radius:12px;border:2px solid var(--primario);background:#fff;font-size:24px;color:var(--primario);cursor:pointer}
.cnt input{text-align:center}
.chk{display:flex;gap:10px;align-items:center;font-size:15px;min-height:48px}
.chk input{width:24px;height:24px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const COLORES={'Recibido':'--e-recibido','Diagnosticado':'--e-diag','Esperando aprobación':'--e-esp','En reparación':'--e-rep','Listo':'--e-listo','Entregado':'--e-ent','Cancelado':'--e-can'};
const FLUJO=['Recibido','Diagnosticado','Esperando aprobación','En reparación','Listo','Entregado'];
const DEMO=()=>({
  vista:'inicio', param:null, simOffline:false, filtro:'Todas', cola:[], notif:[], presu:{},
  ordenes:[
    {id:'OS-0142',placa:'P-512HDK',veh:'Toyota Hilux 2015',km:'98,450',falla:'Ruido al frenar, se siente duro el pedal',cliente:'Andrea López',estado:'Recibido',diag:'',rep:[]},
    {id:'OS-0139',placa:'P-087FGT',veh:'Nissan Sentra 2012',km:'154,200',falla:'Clutch patina',cliente:'Mario Pérez',estado:'En reparación',diag:'Disco de clutch gastado',rep:[{d:'Kit de clutch',c:1,p:1250}]},
    {id:'OS-0140',placa:'P-622JKL',veh:'Kia Picanto 2018',km:'61,030',falla:'Servicio de aceite',cliente:'Lucía Ramírez',estado:'En reparación',diag:'Servicio menor',rep:[{d:'Aceite 10W-30 (galón)',c:1,p:220},{d:'Filtro de aceite',c:1,p:45}]},
    {id:'OS-0141',placa:'M-334BBC',veh:'Honda CG150 2020',km:'22,100',falla:'No arranca',cliente:'José Gómez',estado:'Diagnosticado',diag:'Batería descargada y bujía sucia',rep:[]},
  ].map(o=>({...o,srv:{estado:o.estado,diag:o.diag,rep:JSON.parse(JSON.stringify(o.rep))}}))
});
const MECS=['Kevin López','Luis Pérez','Mario Ruiz'];
const HIST=(()=>{let x=7;const r=()=>(x=(x*16807)%2147483647)/2147483647;const dias=['Lun','Mar','Mié','Jue','Vie','Sáb'];const fallas=['Servicio de aceite','Frenos','Clutch','Suspensión','Batería','Alineación','Motor no arranca','Aire acondicionado'];const out=[];
  for(let i=0;i<36;i++){const u=r();const est=i<26?'Entregado':i<29?'Cancelado':['Recibido','Diagnosticado','Esperando aprobación','En reparación','En reparación','Listo','Listo'][i-29];
    out.push({id:'OS-'+(100+i),placa:'P-'+(100+Math.floor(r()*899))+'X'+String.fromCharCode(65+Math.floor(r()*26))+String.fromCharCode(65+Math.floor(r()*26)),falla:fallas[Math.floor(r()*fallas.length)],mec:MECS[Math.floor(r()*3)],dia:dias[Math.floor(r()*6)],total:est==='Cancelado'?0:Math.round(200+u*1800),estado:est,horas:Math.round(4+r()*70),dias:+(0.5+r()*3.5).toFixed(1)})}
  return out})();
let S;
try{S=JSON.parse(localStorage.getItem('tallerfix_demo'))}catch(e){}
if(!S||!S.ordenes||!S.ordenes[0].srv)S=DEMO();
S.online=navigator.onLine;
function guardar(){try{localStorage.setItem('tallerfix_demo',JSON.stringify(S))}catch(e){}}
function reiniciar(){S=DEMO();S.online=navigator.onLine;guardar();go('inicio');toast('Datos de demostración reiniciados')}
const CLIENTE_ID='OS-0142';
const offline=()=>S.simOffline||!S.online;
const $=s=>document.querySelector(s);
const q=n=>'Q '+(+n).toLocaleString('es-GT',{minimumFractionDigits:2});
const chip=e=>`<span class="chip" style="background:var(${COLORES[e]})">${e}</span>`;
const ord=id=>S.ordenes.find(o=>o.id===id);
const hora=()=>new Date().toLocaleTimeString('es-GT',{hour:'2-digit',minute:'2-digit'});
const idx=e=>e==='Cancelado'?99:FLUJO.indexOf(e);
function go(v,p){S.vista=v;S.param=p;render();window.scrollTo(0,0)}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2800)}
// --- "servidor": aplica un cambio y dispara la notificación al cliente (CU-10) ---
const ROL_N={mecanico:'Mecánico',recepcion:'Recepción',cliente:'Cliente'};
function notificar(id,valor,autor){const o=ord(id);const para=['mecanico','recepcion','cliente'].filter(r=>r!==autor&&(r!=='cliente'||id===CLIENTE_ID));
  S.notif.unshift({id,placa:o.placa,estado:valor,autor,para,vistos:[],hora:hora()})}
function txtNotif(n,rol){return rol==='cliente'?`Su vehículo ${n.placa} pasó a: ${n.estado}`:`${n.placa} (${n.id}) pasó a: ${n.estado} · por ${ROL_N[n.autor]}`}
function servidor(id,campo,valor,autor='mecanico'){const o=ord(id);
  if(campo==='estado'){if(idx(valor)<=idx(o.srv.estado))return false; o.srv.estado=valor; notificar(id,valor,autor);}
  else if(campo==='rep'){o.srv.rep.push(valor)} else o.srv[campo]=valor; return true}
// el teléfono del mecánico baja lo más reciente del servidor (RN-11: gana el estado más avanzado)
function bajar(){S.ordenes.forEach(o=>{if(idx(o.srv.estado)>idx(o.estado))o.estado=o.srv.estado})}
function cambio(desc,id,campo,valor){const o=ord(id);
  if(campo==='rep')o.rep.push(valor);else o[campo]=valor;
  if(offline()){S.cola.push({desc,hora:hora(),id,campo,valor});toast('Guardado en el teléfono. Se enviará al volver la señal.')}
  else{servidor(id,campo,valor);toast(campo==='estado'?'Guardado ✓ Se notificó a recepción y al cliente.':'Guardado ✓')}
  guardar()}
function sincronizar(){if(offline()){toast('Todavía no hay señal');return}const n=S.cola.length;
  S.cola.forEach(c=>{if(!servidor(c.id,c.campo,c.valor)&&c.campo==='estado')toast('Conflicto: se conservó el estado más avanzado (RN-11)')});
  S.cola=[];bajar();guardar();render();toast(n?`Sincronizado ✓ ${n} cambio(s) enviados. Recepción y cliente ya fueron notificados.`:'Todo está sincronizado ✓')}
window.addEventListener('online',()=>{S.online=true;if(!S.simOffline&&S.cola.length)sincronizar();else render()});
window.addEventListener('offline',()=>{S.online=false;render()});

function rolVista(){const v=S.vista;return v.startsWith('m_')?'mecanico':v.startsWith('r_')?'recepcion':v.startsWith('c_')?'cliente':S.vista==='notif'?S.param.rol:null}
const OBLIG={cliente:['Esperando aprobación','Listo'],recepcion:[],mecanico:[]};
function silenciado(rol,estado){const c=(S.cfg||{})[rol]||{};return !(OBLIG[rol]||[]).includes(estado)&&c[estado]===false}
function misNotif(rol){const sinSync=rol==='mecanico'&&offline();return sinSync?[]:S.notif.filter(n=>n.para.includes(rol))}
function campana(){const rol=rolVista();if(!rol||S.vista==='notif')return '';const k=misNotif(rol).filter(n=>!n.vistos.includes(rol)&&!silenciado(rol,n.estado)).length;
  return `<button class="hb" aria-label="Notificaciones" style="position:relative" onclick="go('notif',{rol:'${rol}',vuelta:S.vista,p:S.param})">🔔${k?`<span style="position:absolute;top:4px;right:2px;background:#C62828;color:#fff;border-radius:10px;font-size:11px;font-weight:700;min-width:18px;height:18px;line-height:18px;padding:0 4px">${k}</span>`:''}</button>`}
function head(t,back,extra=''){return `<header>${back?`<button class="hb" aria-label="Regresar" onclick="${back}">←</button>`:''}<h1>${t}</h1>${extra}${campana()}</header>`}
function bannerRed(){return offline()?`<div class="banner off">⚠ <span class="grow">Sin conexión${S.cola.length?` · ${S.cola.length} cambio(s) pendiente(s)`:''}</span></div>`:`<div class="banner on">● En línea · todo sincronizado</div>`}
const swOff=()=>`<button class="switch" onclick="S.simOffline=!S.simOffline;guardar();if(!S.simOffline&&S.online&&S.cola.length)sincronizar();else render()">${S.simOffline?'📵 Sin señal':'📶 Con señal'}</button>`;
const lineasPresu=o=>[...o.srv.rep.map(r=>({d:r.d,c:r.c,p:r.p,foto:r.foto})),{d:'Mano de obra',c:1,p:150}];
const totalL=l=>l.reduce((a,r)=>a+r.c*r.p,0);

const V={
notif_cfg:()=>{const {rol}=S.param;S.cfg=S.cfg||{};S.cfg[rol]=S.cfg[rol]||{};const c=S.cfg[rol];const est=['Recibido','Diagnosticado','Esperando aprobación','En reparación','Listo','Entregado','Cancelado'];return `${head('Configurar avisos · '+ROL_N[rol],"go('notif',S.param)")}<main>
  <div class="banner info">ℹ Los avisos silenciados no suenan ni aparecen en el contador, pero se siguen guardando en la bandeja.</div>
  <div class="card"><label>Avisarme cuando una orden pase a:</label>
  ${est.map(e=>{const ob=(OBLIG[rol]||[]).includes(e);return `<label class="chk"><input type="checkbox" ${c[e]!==false||ob?'checked':''} ${ob?'disabled':''} onchange="S.cfg['${rol}']['${e}']=this.checked;guardar()"> ${chip(e)} ${ob?'<b style="font-size:12px;color:var(--primario)">🔒 Obligatorio</b>':''}</label>`}).join('')}</div>
  ${rol==='recepcion'?`<div class="card"><label>Modo para talleres con mucho movimiento</label><button class="btn sec" onclick="['Recibido','Diagnosticado','En reparación','Entregado'].forEach(e=>S.cfg.recepcion[e]=false);guardar();render();toast('Solo sonarán: Esperando aprobación, Listo y Cancelado')">🔕 Solo avisos importantes</button><span class="muted">Deja sonar solo lo que requiere acción de la recepción. El resto se revisa en el Panel del dueño.</span></div>`:''}
  ${rol==='cliente'?'<div class="banner info">🔒 Los avisos de presupuesto (Esperando aprobación) y de vehículo Listo no se pueden silenciar porque requieren su acción (RN-13).</div>':''}
</main>`},
notif:()=>{const {rol,vuelta,p}=S.param;const l=misNotif(rol);const html=`${head('Notificaciones · '+ROL_N[rol],`go('${vuelta}',${JSON.stringify(p)===undefined?'null':JSON.stringify(p).replace(/"/g,"'")})`)}<main>
  ${rol==='mecanico'&&offline()?'<div class="banner off">⚠ Sin conexión: las notificaciones nuevas llegarán al volver la señal.</div>':''}
  <button class="btn sec" onclick="go('notif_cfg',S.param)">⚙ Configurar qué avisos recibo</button>
  ${l.length?l.map(n=>{const sil=silenciado(rol,n.estado);return `<div class="card" style="${n.vistos.includes(rol)||sil?'':'border-left:5px solid var(--acento)'}${sil?';opacity:.6':''}"><div class="row"><b class="grow">${n.placa}</b>${chip(n.estado)}</div><span>${txtNotif(n,rol)}</span><span class="muted">${n.hora}${sil?' · 🔕 silenciado (no sonó)':''}</span></div>`}).join(''):'<span class="muted">No tiene notificaciones.</span>'}
</main>`;l.forEach(n=>{if(!n.vistos.includes(rol))n.vistos.push(rol)});return html},
inicio:()=>`${head('TallerFix')}<main>
  <div class="card"><b style="font-size:18px">Prototipo navegable</b><span class="muted">Proyecto Final · Análisis de Sistemas II. Datos de ejemplo. Los tres roles comparten los mismos datos: lo que hace uno lo ve el otro (como si fuera el servidor).</span></div>
  <button class="card tap rol" onclick="go('m_lista')"><span>🔧</span><div><b>Soy mecánico</b><div class="muted">Ver mis órdenes y marcar avances</div></div></button>
  <button class="card tap rol" onclick="go('r_lista')"><span>🗂️</span><div><b>Soy recepción / dueño</b><div class="muted">Enviar presupuestos, registrar entregas y ver el panel del dueño</div></div></button>
  <button class="card tap rol" onclick="go('c_estado')"><span>🚗</span><div><b>Soy cliente</b><div class="muted">Ver el estado de mi vehículo (P-512HDK) y aprobar presupuestos</div></div></button>
  <button class="btn sec" onclick="reiniciar()">↺ Reiniciar datos de demostración</button>
  <button class="btn sec" onclick="escenarioCliente()">🧪 Preparar prueba del cliente (presupuesto listo)</button>
</main>`,

m_lista:()=>{if(!offline())bajar();const fs=['Todas','Recibido','Diagnosticado','En reparación','Listo'];const l=S.ordenes.filter(o=>S.filtro==='Todas'||o.estado===S.filtro);return `${head('Mis órdenes',"go('inicio')",swOff())}<main>
  ${bannerRed()}
  <input placeholder="🔍 Buscar placa…" oninput="S.busca=this.value.toUpperCase();document.querySelectorAll('[data-placa]').forEach(c=>c.style.display=c.dataset.placa.includes(S.busca)?'':'none')">
  <div class="filtros">${fs.map(f=>`<button class="${S.filtro===f?'on':''}" onclick="S.filtro='${f}';render()">${f}</button>`).join('')}</div>
  ${l.map(o=>`<div class="card tap" data-placa="${o.placa}" onclick="go('m_detalle','${o.id}')"><div class="row"><span class="placa grow">${o.placa}</span>${chip(o.estado)}</div><span class="muted">${o.veh} · "${o.falla}"</span></div>`).join('')||'<span class="muted">No hay órdenes en este estado</span>'}
  <button class="btn sec" onclick="go('m_sync')">⇅ Ver sincronización</button>
</main>`},

m_detalle:()=>{if(!offline())bajar();const o=ord(S.param);const sig={'Recibido':'Diagnosticado','En reparación':'Listo'}[o.estado];const puede=sig&&(sig!=='Diagnosticado'||o.diag);const pend=S.cola.some(c=>c.id===o.id);return `${head(o.id+' · '+o.placa,"go('m_lista')",swOff())}<main>
  ${bannerRed()}
  <div class="row">${chip(o.estado)}<span class="muted">${o.veh} · ${o.km} km</span></div>
  ${pend?'<div class="banner off">⏳ Esta orden tiene cambios que aún no llegan al servidor (el cliente todavía no los ve).</div>':''}
  <div class="card"><label>Falla reportada</label><span>"${o.falla}"</span></div>
  <div class="row"><div class="foto">📷 foto ingreso</div><div class="foto">📷 foto ingreso</div></div>
  <div class="card"><div class="row"><label class="grow">Diagnóstico</label><button class="btn sec" style="width:auto;min-height:44px" onclick="go('m_diag','${o.id}')">${o.diag?'Editar':'+ Diagnóstico'}</button></div><span>${o.diag||'<span class="muted">Sin diagnóstico todavía</span>'}</span>${(o.fotos||[]).length?`<div class="row" style="flex-wrap:wrap">${o.fotos.map(f=>`<img src="${f}" style="width:70px;height:70px;object-fit:cover;border-radius:8px">`).join('')}</div>`:''}</div>
  <div class="card"><div class="row"><label class="grow">Repuestos (${o.rep.length})</label><button class="btn sec" style="width:auto;min-height:44px" onclick="go('m_rep','${o.id}')">+ Repuesto</button></div>
    ${o.rep.length?`<table>${o.rep.map(r=>`<tr><td>${r.d}${r.adicional?' <i class="muted">(adicional)</i>':''}</td><td>${r.c}</td><td>${q(r.p*r.c)}</td></tr>`).join('')}</table>`:'<span class="muted">Aún no hay repuestos</span>'}</div>
  ${o.estado==='Diagnosticado'?'<div class="banner info">ℹ La recepción está preparando el presupuesto para el cliente.</div>':''}
  ${o.estado==='Esperando aprobación'?'<div class="banner info">ℹ Esperando que el cliente apruebe el presupuesto. No inicie la reparación (RN-01).</div>':''}
  ${o.estado==='Cancelado'?'<div class="banner off">✗ El cliente rechazó el presupuesto. No se hará la reparación.</div>':''}
  ${o.estado==='Recibido'&&!o.diag?'<div class="banner info">ℹ Registre el diagnóstico para poder avanzar.</div>':''}
</main>${sig?`<button class="fab" ${puede?'':'disabled style="opacity:.5"'} onclick="cambio('${o.placa} → ${sig}','${o.id}','estado','${sig}');render()">✓ MARCAR COMO ${sig.toUpperCase()}</button>`:''}`},

m_diag:()=>{const o=ord(S.param);if(S.tmpF===undefined||S.tmpFid!==o.id){S.tmpF=[...(o.fotos||[])];S.tmpD=o.diag;S.tmpFid=o.id}return `${head('Diagnóstico · '+o.placa,`go('m_detalle','${o.id}')`)}<main>
  <label>¿Qué encontró?</label><textarea id="dg" rows="5" placeholder="Ej.: Pastillas de freno delanteras gastadas" oninput="S.tmpD=this.value">${S.tmpD}</textarea>
  <button class="btn pri" onclick="document.querySelector('.fab').click()">Guardar diagnóstico</button>
  <label>Fotos para el cliente (opcional)</label>
  <div class="row" style="flex-wrap:wrap">${(S.tmpF||[]).map((f,i)=>`<img src="${f}" style="width:90px;height:90px;object-fit:cover;border-radius:10px" onclick="S.tmpF.splice(${i},1);render()">`).join('')}
    <label class="foto" style="cursor:pointer;max-width:120px">📷 Tomar foto<input type="file" accept="image/*" capture="environment" hidden onchange="tomarFoto(this,f=>{S.tmpF=[...(S.tmpF||[]),f];render()})"></label></div>
  <span class="muted">Las fotos se comprimen antes de enviarse (RNF-M04). Toque una foto para quitarla.</span>
  <div class="banner info">ℹ Se guarda en el teléfono aunque no haya señal.</div>
</main><button class="fab" onclick="const t=$('#dg').value.trim();if(!t){toast('Escriba el diagnóstico');return}cambio('${o.placa} · diagnóstico','${o.id}','diag',t);if((S.tmpF||[]).length)cambio('${o.placa} · fotos','${o.id}','fotos',S.tmpF);S.tmpF=undefined;S.tmpFid=null;go('m_detalle','${o.id}')">GUARDAR DIAGNÓSTICO</button>`},

m_rep:()=>{const o=ord(S.param);S.repF=null;return `${head('Agregar repuesto · '+o.placa,`go('m_detalle','${o.id}')`)}<main>
  <label>Repuesto</label><input id="rd" placeholder="Ej.: Pastillas de freno">
  <label>Precio unitario (Q)</label><input id="rp" type="number" inputmode="decimal" placeholder="0.00" oninput="sub()">
  <label>Cantidad</label><div class="cnt"><button onclick="$('#rc').value=Math.max(1,+$('#rc').value-1);sub()">−</button><input id="rc" type="number" value="1" oninput="sub()"><button onclick="$('#rc').value=+$('#rc').value+1;sub()">＋</button></div>
  <div class="card"><div class="row"><span class="grow">Subtotal</span><b id="st">Q 0.00</b></div></div>
  <label>Foto del repuesto (opcional)</label>
  <div class="row"><img id="rfImg" style="width:90px;height:90px;object-fit:cover;border-radius:10px;display:none"><label class="foto" style="cursor:pointer;max-width:140px">📷 Tomar foto<input type="file" accept="image/*" capture="environment" hidden onchange="tomarFoto(this,f=>{S.repF=f;$('#rfImg').src=f;$('#rfImg').style.display=''})"></label></div>
  ${o.estado==='En reparación'?'<label class="chk"><input type="checkbox" id="ra"> Es un repuesto adicional (pedir aprobación al cliente)</label>':''}
</main><button class="fab" onclick="agregarRep('${o.id}')">AGREGAR REPUESTO</button>`},

m_sync:()=>`${head('Sincronización',"go('m_lista')",swOff())}<main>
  <div class="card" style="align-items:center;text-align:center"><div style="font-size:40px">${offline()?'⚠':'✓'}</div><b style="font-size:18px">${offline()?'Sin conexión':'En línea'}</b><span class="muted">${offline()?'Sus cambios están guardados en el teléfono. El cliente los verá cuando se sincronicen.':'Los cambios se envían automáticamente'}</span></div>
  <label>Pendientes de enviar (${S.cola.length})</label>
  ${S.cola.length?S.cola.map(c=>`<div class="card"><div class="row"><span class="grow">${c.desc}</span><span class="muted">${c.hora}</span></div></div>`).join(''):'<span class="muted">No hay cambios pendientes ✓</span>'}
</main><button class="fab" onclick="sincronizar()">⇅ SINCRONIZAR AHORA</button>`,

r_panel:()=>{const act=S.ordenes.map((o,i)=>({id:o.id,placa:o.placa,falla:o.falla,mec:MECS[i%3],dia:'Vie',total:S.presu[o.id]?S.presu[o.id].total:0,estado:o.srv.estado,horas:o.id===CLIENTE_ID?2:30,dias:1}));const T=[...HIST,...act];
  const cnt=e=>T.filter(o=>o.estado===e).length;const abiertas=T.filter(o=>!['Entregado','Cancelado'].includes(o.estado));
  const aprobadas=T.filter(o=>['En reparación','Listo','Entregado'].includes(o.estado));const ingresos=aprobadas.reduce((a,o)=>a+o.total,0);
  const resp=T.filter(o=>o.estado!=='Recibido'&&o.estado!=='Diagnosticado'&&o.estado!=='Esperando aprobación');const tasa=Math.round(aprobadas.length/Math.max(1,aprobadas.length+cnt('Cancelado'))*100);
  const ent=T.filter(o=>o.estado==='Entregado');const prom=(ent.reduce((a,o)=>a+o.dias,0)/Math.max(1,ent.length)).toFixed(1);
  const esperando=T.filter(o=>o.estado==='Esperando aprobación');const listos=T.filter(o=>o.estado==='Listo');
  const dias=['Lun','Mar','Mié','Jue','Vie','Sáb'];const porDia=dias.map(d=>T.filter(o=>o.dia===d).length);const mx=Math.max(...porDia);
  const carga=MECS.map(m=>[m,abiertas.filter(o=>o.mec===m).length]);const mxc=Math.max(1,...carga.map(c=>c[1]));
  const est=['Recibido','Diagnosticado','Esperando aprobación','En reparación','Listo'];
  const kpi=(t,v,s,c='')=>`<div class="card" style="flex:1;min-width:46%;gap:2px"><span class="muted" style="font-size:12px">${t}</span><b style="font-size:24px;${c}">${v}</b><span class="muted" style="font-size:12px">${s}</span></div>`;
  const barra=(l,v,m,col)=>`<div class="row" style="gap:8px"><span style="width:110px;font-size:13px">${l}</span><div style="flex:1;background:#E8ECEF;border-radius:6px;height:18px"><div style="width:${Math.round(v/m*100)}%;background:${col};height:18px;border-radius:6px"></div></div><b style="width:24px;text-align:right">${v}</b></div>`;
  return `${head('Panel del dueño',"go('r_lista')")}<main>
  <span class="muted">Semana actual · ${T.length} órdenes · datos de ejemplo</span>
  <div class="row" style="flex-wrap:wrap;gap:10px;align-items:stretch">
    ${kpi('Órdenes de la semana',T.length,'ingresadas Lun–Sáb')}
    ${kpi('Abiertas ahora',abiertas.length,'en el taller')}
    ${kpi('Ingresos aprobados',q(ingresos).replace('.00',''),'presupuestos aprobados','color:var(--ok)')}
    ${kpi('Tasa de aprobación',tasa+' %','aprobados vs. rechazados')}
    ${kpi('Tiempo promedio',prom+' días','desde ingreso hasta entrega')}
    ${kpi('Listos sin recoger',listos.length,'avisar al cliente',listos.length?'color:var(--e-esp)':'')}
  </div>
  ${esperando.length||listos.length?`<div class="card"><label>⚠ Requieren atención</label>${esperando.map(o=>`<div class="row"><span class="grow">${o.placa} · presupuesto sin respuesta</span><span class="chip" style="background:${o.horas>=48?'var(--error)':'var(--e-esp)'}">${o.horas} h</span></div>`).join('')}${listos.map(o=>`<div class="row"><span class="grow">${o.placa} · listo, sin recoger</span>${chip('Listo')}</div>`).join('')}</div>`:''}
  <div class="card"><label>Órdenes abiertas por estado</label>${est.map(e=>barra(e,cnt(e),Math.max(1,...est.map(cnt)),`var(${COLORES[e]})`)).join('')}</div>
  <div class="card"><label>Carga por mecánico (órdenes abiertas)</label>${carga.map(([m,v])=>barra(m,v,mxc,'var(--primario)')).join('')}</div>
  <div class="card"><label>Órdenes ingresadas por día</label><div class="row" style="align-items:flex-end;height:120px;gap:8px">${dias.map((d,i)=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px"><b style="font-size:12px">${porDia[i]}</b><div style="width:100%;background:var(--acento);border-radius:6px 6px 0 0;height:${Math.round(porDia[i]/mx*80)}px"></div><span class="muted" style="font-size:12px">${d}</span></div>`).join('')}</div></div>
  <div class="card"><label>Fallas más frecuentes</label>${Object.entries(T.reduce((a,o)=>(a[o.falla]=(a[o.falla]||0)+1,a),{})).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([f,v])=>barra(f,v,T.length/3,'var(--e-diag)')).join('')}</div>
</main>`},
r_lista:()=>{const grupos=['Recibido','Diagnosticado','Esperando aprobación','En reparación','Listo','Entregado','Cancelado'];return `${head('Recepción · Órdenes',"go('inicio')")}<main>
  <button class="btn pri" onclick="go('r_panel')">📊 Panel del dueño</button>
  <div class="banner info">ℹ Aquí se ve lo que tiene el servidor. Si el mecánico trabajó sin señal, sus cambios aparecen hasta que sincroniza.</div>
  ${grupos.map(g=>{const l=S.ordenes.filter(o=>o.srv.estado===g);return l.length?`<label>${g} (${l.length})</label>`+l.map(o=>`<div class="card tap" onclick="go('r_detalle','${o.id}')"><div class="row"><span class="placa grow">${o.placa}</span>${chip(o.srv.estado)}</div><span class="muted">${o.veh} · ${o.cliente}</span></div>`).join(''):''}).join('')}
</main>`},

r_detalle:()=>{const o=ord(S.param);const e=o.srv.estado;const l=lineasPresu(o);return `${head(o.id+' · '+o.placa,"go('r_lista')")}<main>
  <div class="row">${chip(e)}<span class="muted">${o.cliente}</span></div>
  <div class="card"><label>Diagnóstico (servidor)</label><span>${o.srv.diag||'<span class="muted">Aún no llega el diagnóstico del mecánico</span>'}</span></div>
  ${e==='Diagnosticado'?`<div class="card"><label>Presupuesto a enviar</label><table>${l.map(r=>`<tr><td>${r.d}</td><td>${r.c}</td><td>${q(r.c*r.p)}</td></tr>`).join('')}<tr class="total"><td>Total</td><td></td><td>${q(totalL(l))}</td></tr></table></div>
     <button class="btn pri" onclick="enviarPresu('${o.id}')">Enviar presupuesto al cliente</button>`:''}
  ${e==='Recibido'?'<div class="banner info">ℹ Esperando el diagnóstico del mecánico.</div>':''}
  ${e==='Esperando aprobación'?'<div class="banner info">⏳ Esperando la respuesta del cliente.</div>':''}
  ${e==='En reparación'?'<div class="banner on">✓ Presupuesto aprobado por el cliente. El mecánico ya puede reparar.</div>':''}
  ${e==='Listo'?`<button class="btn ok" onclick="servidor('${o.id}','estado','Entregado','recepcion');guardar();toast('Entrega registrada ✓ Se notificó al cliente y al mecánico.');render()">Registrar entrega</button>`:''}
  ${e==='Cancelado'?'<div class="banner off">✗ El cliente rechazó el presupuesto. Registrar devolución del vehículo.</div>':''}
</main>`},

c_estado:()=>{const o=ord(CLIENTE_ID);const e=o.srv.estado;const ix=FLUJO.indexOf(e);const pasos=e==='Cancelado'?['Recibido','Diagnosticado','Esperando aprobación','Cancelado']:FLUJO;const n=S.notif.find(x=>x.id===CLIENTE_ID&&x.para.includes('cliente'));return `${head('Taller El Progreso',"go('inicio')")}<main>
  ${n?`<div class="banner info">🔔 ${txtNotif(n,'cliente')} <span class="muted">(${n.hora})</span></div>`:''}
  <div class="card"><span class="placa">${o.placa}</span><span class="muted">${o.veh} · Orden ${o.id}</span></div>
  <div class="card"><label>Estado de su vehículo</label><div class="tl">${pasos.map((p,i)=>{const pi=e==='Cancelado'?(i<3?'hecho':'actual'):(i<ix?'hecho':i===ix?'actual':'');return `<div class="p ${pi}"><div class="dot">${pi==='hecho'?'✓':''}</div><div>${pi==='actual'?`<b>${p==='Esperando aprobación'?'Esperando su aprobación':p}</b>`:`<span class="${pi?'':'muted'}">${p}</span>`}</div></div>`}).join('')}</div></div>
  ${S.decision?`<div class="banner ${S.decision.d==='aprobado'?'on':'off'}">Presupuesto ${S.decision.d} el ${S.decision.f}</div>`:''}
  <div class="row"><button class="btn sec" onclick="go('c_hist')">Historial</button><a class="btn sec" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="tel:55551234">📞 Llamar</a></div>
</main>${e==='Esperando aprobación'?`<button class="fab" onclick="go('c_presu')">VER PRESUPUESTO</button>`:''}`},

c_presu:()=>{const o=ord(CLIENTE_ID);const p=S.presu[CLIENTE_ID];if(!p||o.srv.estado!=='Esperando aprobación')return V.c_estado();return `${head('Presupuesto',"go('c_estado')")}<main>
  <div class="card"><label>Diagnóstico del mecánico</label><span>${o.srv.diag}</span></div>
  ${(()=>{const fs=[...(o.srv.fotos||[]).map(f=>[f,'Diagnóstico']),...p.lineas.filter(r=>r.foto).map(r=>[r.foto,r.d])];return fs.length?`<div class="card"><label>Fotos enviadas por el taller</label><div class="row" style="flex-wrap:wrap">${fs.map(([f,t])=>`<figure style="margin:0;width:110px"><img src="${f}" style="width:110px;height:110px;object-fit:cover;border-radius:10px"><figcaption class="muted" style="font-size:12px">${t}</figcaption></figure>`).join('')}</div></div>`:'<span class="muted">El mecánico no adjuntó fotos a este presupuesto.</span>'})()}
  ${(()=>{const rp=p.lineas.filter(r=>r.d!=='Mano de obra'),mo=p.lineas.filter(r=>r.d==='Mano de obra');const sec=(t,l)=>l.length?`<div class="card"><label>${t}</label><table>${l.map(r=>`<tr><td>${r.d}${r.c>1?` <span class="muted">× ${r.c}</span>`:''}</td><td>${q(r.c*r.p)}</td></tr>`).join('')}<tr><td class="muted">Subtotal ${t.toLowerCase()}</td><td class="muted">${q(totalL(l))}</td></tr></table></div>`:'';
    return sec('Repuestos',rp)+sec('Mano de obra',mo)+`<div class="card" style="background:#E8F0F8;border-color:#BFD3E6"><div class="row"><b class="grow" style="font-size:18px">TOTAL A PAGAR</b><b style="font-size:26px;color:var(--primario)">${q(p.total)}</b></div><span class="muted">Precio final: no se cobrará nada adicional sin su aprobación. Garantía de 30 días en mano de obra.</span></div>`})()}
  <span class="muted">Al aprobar o rechazar queda registrada la fecha y la hora. Esta decisión no se puede cambiar después.</span>
  <button class="btn ok" onclick="confirmar('¿Confirma que aprueba el presupuesto por ${q(p.total)}?',()=>decidir('aprobado'))">✓ APROBAR</button>
  <button class="btn mal" onclick="go('c_rech')">✗ Rechazar</button>
</main>`},

c_rech:()=>`${head('Rechazar presupuesto',"go('c_presu')")}<main>
  <div class="banner off">Si rechaza, no se hará la reparación y podrá recoger su vehículo.</div>
  <label>Motivo (opcional)</label><select id="mo"><option>Prefiero no hacerlo por ahora</option><option>Me parece muy caro</option><option>Lo haré en otro lugar</option><option>Otro</option></select>
  <button class="btn mal" onclick="decidir('rechazado')">Confirmar rechazo</button>
</main>`,

c_ok:()=>{const ok=S.decision.d==='aprobado';return `${head('Listo',"go('c_estado')")}<main style="align-items:center;text-align:center;padding-top:40px">
  <div style="font-size:64px;color:${ok?'var(--ok)':'var(--error)'}">${ok?'✓':'✗'}</div>
  <b style="font-size:22px">Presupuesto ${S.decision.d}</b><span class="muted">${S.decision.f}</span>
  <div class="card" style="text-align:left;width:100%">${ok?`Total aprobado: <b>${q(S.presu[CLIENTE_ID].total)}</b><span class="muted">El taller ya puede iniciar la reparación. Le avisaremos cuando su vehículo esté listo.</span>`:'<span class="muted">El taller fue avisado. Puede pasar a recoger su vehículo.</span>'}</div>
  <button class="btn pri" onclick="go('c_estado')">VER ESTADO</button>
  <button class="btn sec" onclick="const t='Comprobante TallerFix · OS-0142 · P-512HDK · Presupuesto '+S.decision.d+' el '+S.decision.f+' · Total '+q(S.presu[CLIENTE_ID].total);if(navigator.share)navigator.share({text:t}).catch(()=>{});else{try{navigator.clipboard.writeText(t)}catch(e){};toast('Comprobante copiado para enviar por WhatsApp o correo')}">Compartir comprobante</button>
</main>`},

c_hist:()=>`${head('Historial · P-512HDK',"go('c_estado')")}<main>
  ${[['10/03/2026','Orden actual · '+ord(CLIENTE_ID).falla,ord(CLIENTE_ID).srv.estado,S.presu[CLIENTE_ID]?S.presu[CLIENTE_ID].total:0],['05/11/2025','Servicio de aceite y filtros','Entregado',425],['20/06/2025','Alineación y balanceo','Entregado',200],['02/02/2025','Revisión de suspensión (rechazado)','Cancelado',0]].map(h=>`<div class="card"><div class="row"><b class="grow">${h[0]}</b>${chip(h[2])}</div><span>${h[1]}</span>${h[3]?`<span class="muted">${q(h[3])}</span>`:''}</div>`).join('')}
</main>`,
};
function confirmar(msg,ok){const f=document.createElement('div');f.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20';f.innerHTML=`<div style="background:#fff;width:100%;max-width:420px;border-radius:18px 18px 0 0;padding:20px 16px 24px;display:flex;flex-direction:column;gap:12px"><b style="font-size:18px">Confirmar</b><span>${msg}</span><span class="muted">Esta decisión no se puede cambiar después.</span><button class="btn ok" id="cfSi">Sí, aprobar</button><button class="btn sec" id="cfNo">Cancelar</button></div>`;document.body.appendChild(f);f.querySelector('#cfSi').onclick=()=>{f.remove();ok()};f.querySelector('#cfNo').onclick=()=>f.remove();f.onclick=e=>{if(e.target===f)f.remove()}}
function tomarFoto(inp,cb){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',0.6))};im.src=r.result};r.readAsDataURL(f)}
function sub(){const t=(+$('#rc').value||0)*(+$('#rp').value||0);$('#st').textContent=q(t)}
function agregarRep(id){const d=$('#rd').value.trim(),c=+$('#rc').value,p=+$('#rp').value;if(!d||!c||!p){toast('Complete repuesto, cantidad y precio');return}const ad=!!($('#ra')&&$('#ra').checked);cambio(`${ord(id).placa} · repuesto`,id,'rep',{d,c,p,adicional:ad,foto:S.repF||null});S.repF=null;if(ad)setTimeout(()=>toast('Se pidió aprobación del adicional al cliente'),2900);go('m_detalle',id)}
function enviarPresu(id){const o=ord(id);const l=lineasPresu(o);const t=totalL(l);if(!t){toast('No se puede enviar un presupuesto en Q0 (RN-02)');return}S.presu[id]={lineas:l,total:t};servidor(id,'estado','Esperando aprobación','recepcion');guardar();toast('Presupuesto enviado ✓ Se notificó al cliente y al mecánico.');render()}
function decidir(d){const nuevo=d==='aprobado'?'En reparación':'Cancelado';S.decision={d,f:new Date().toLocaleString('es-GT',{dateStyle:'short',timeStyle:'short'})};servidor(CLIENTE_ID,'estado',nuevo,'cliente');guardar();go('c_ok')}
function escenarioCliente(){S=DEMO();S.online=navigator.onLine;const o=ord(CLIENTE_ID);o.diag=o.srv.diag='Pastillas de freno delanteras gastadas. El disco está en buen estado.';const r={d:'Pastillas de freno delanteras',c:1,p:350};o.rep.push({...r});o.srv.rep.push({...r});o.estado='Diagnosticado';o.srv.estado='Diagnosticado';enviarPresu(CLIENTE_ID);o.estado='Esperando aprobación';guardar();go('c_estado')}
function render(){$('#app').innerHTML=V[S.vista]();guardar()}
render();
</script>
</body>
</html>
